# Create this file on GitHub as:  .github/workflows/build.yml
# It only runs when you ask: Actions tab > Build > Run workflow.

name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TransLog.slnx

      - name: Build
        run: dotnet build TransLog.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish TransLog.Web/TransLog.Web.csproj --configuration Release --no-build --output publish

      # The published site, downloadable from the run's page under Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: translog-web
          path: publish
