# Create this file on GitHub as:  .github/workflows/deploy.yml
# It only runs when you ask: Actions tab > Deploy > Run workflow.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_USER       the Plesk FTP user name
#   FTP_PASSWORD   the Plesk FTP password
#   DB_CONNECTION  the full SQL Server connection string
#
# Files already on the server that are not in the build (uploads/, App_Data/) are never deleted.

name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained: runs on the server even if .NET 10 is not installed there.
      - name: Publish for Windows
        run: >
          dotnet publish TransLog.Web/TransLog.Web.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      # The connection string only exists on the server, never in the repository.
      - name: Write appsettings.Production.json
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          if [ -z "$DB_CONNECTION" ]; then echo "::error::Secret DB_CONNECTION is not set."; exit 1; fi
          jq -n --arg cs "$DB_CONNECTION" '{ConnectionStrings: {Default: $cs}}' > publish/appsettings.Production.json

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # app_offline.htm stops the site so its files can be replaced, then it is removed.
      - name: Upload to /httpdocs
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then echo "::error::Secrets FTP_USER and FTP_PASSWORD must be set."; exit 1; fi
          echo '<!doctype html><title>TransLog</title><p>TransLog is being updated. Try again in a minute.</p>' > app_offline.htm
          lftp -u "$FTP_USER","$FTP_PASSWORD" 69.10.38.62 <<'EOF'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set net:max-retries 3
          set net:timeout 30
          put app_offline.htm -o /httpdocs/app_offline.htm
          mirror --reverse --parallel=4 --verbose=1 publish /httpdocs
          rm /httpdocs/app_offline.htm
          bye
          EOF

      - name: Check the site answers
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 http://trans-log.duckdns.org/ || true)
          echo "Site answered HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then echo "::warning::Site did not answer properly. Check Plesk > Logs."; fi
