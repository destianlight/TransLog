# Create this file on GitHub as:  .github/workflows/add-migration.yml
# Creates an EF Core migration (database change script) and commits it, then starts Test.

name: Add migration

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Migration name, for example Initial (letters, digits and _ only)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  add:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Add migration
        env:
          NAME: ${{ inputs.name }}
        run: |
          if ! [[ "$NAME" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]; then
            echo "::error::Use letters, digits and _ only, starting with a letter."; exit 1
          fi
          dotnet ef migrations add "$NAME" --project TransLog.Web --output-dir Data/Migrations

      - name: Commit and push
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Add migration $NAME"
          git push
          git show --stat --format="" HEAD

      - name: Start Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref "${{ github.ref_name }}"
