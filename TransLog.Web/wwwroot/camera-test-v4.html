<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>TransLog camera test v4</title>
<style>
  :root { --o: #F97316; --n: #0B1F3A; --glass: rgba(0,0,0,.42); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; color: #fff; font: 15px/1.4 system-ui, sans-serif; }
  [hidden] { display: none !important; }

  /* The camera is exactly the browser window: nothing above or below it, no scrolling. */
  .cam { position: fixed; inset: 0; height: 100dvh; overflow: hidden; touch-action: manipulation; user-select: none; }
  .cam video, #review { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cam video { object-fit: cover; }
  #review { object-fit: contain; background: #000; }
  #tap { position: absolute; inset: 0; }

  /* Guide: the box-shadow dims everything outside it; four corner brackets. Drawn once, no redraws. */
  .guide { position: absolute; left: 7%; right: 7%; top: 16%; bottom: 23%; border-radius: 18px;
           box-shadow: 0 0 0 100vmax rgba(0,0,0,.30); pointer-events: none; }
  .guide i { position: absolute; width: 14%; aspect-ratio: 1; border: 0 solid #fff; filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); }
  .guide i:nth-child(1) { top: -2px; left: -2px; border-top-width: 5px; border-left-width: 5px; border-top-left-radius: 18px; }
  .guide i:nth-child(2) { top: -2px; right: -2px; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 18px; }
  .guide i:nth-child(3) { bottom: -2px; right: -2px; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 18px; }
  .guide i:nth-child(4) { bottom: -2px; left: -2px; border-bottom-width: 5px; border-left-width: 5px; border-bottom-left-radius: 18px; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .ring { position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border: 3px solid var(--o); border-radius: 50%;
          pointer-events: none; animation: ring 1.3s ease-out forwards; }
  .ring::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--o); }
  @keyframes ring { 0% { transform: scale(1.5); opacity: 0; } 15% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(.9); opacity: 0; } }

  .glass { background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; border: 0; }
  .round { width: 56px; height: 56px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 600 22px system-ui; cursor: pointer; padding: 0; position: relative; }
  .round svg { width: 26px; height: 26px; fill: currentColor; }
  .round.sm { width: 40px; height: 40px; font-size: 18px; }
  .round:disabled { opacity: .35; }
  .round.on { background: var(--o); }
  .pill { padding: 8px 12px; border-radius: 20px; font: 600 13px system-ui; cursor: pointer; white-space: nowrap; }
  .pill input { display: none; }
  .seg { display: inline-flex; border-radius: 20px; overflow: hidden; }
  .seg button { padding: 8px 11px; font: 600 13px system-ui; background: transparent; color: #fff; border: 0; cursor: pointer; }
  .seg button.on { background: var(--o); }

  .top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 6px; align-items: center; }
  .top .sp { flex: 1; }
  .hint { position: absolute; left: 50%; top: calc(16% - 44px); transform: translateX(-50%); padding: 6px 14px; border-radius: 18px;
          font: 600 13px system-ui; white-space: nowrap; pointer-events: none; }
  .toast { position: absolute; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 96px); transform: translateX(-50%);
           max-width: 90%; padding: 8px 14px; border-radius: 18px; font: 600 14px system-ui; text-align: center; }

  .bottom { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: center; }
  .shutter { width: 80px; height: 80px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.22); cursor: pointer; padding: 0; transition: transform .1s; }
  .shutter:active { transform: scale(.92); background: rgba(255,255,255,.6); }
  .shutter:disabled { opacity: .35; }
  #thumbBtn { background-size: cover; background-position: center; }
  #thumbBtn .badge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--o); font: 700 12px/22px system-ui; text-align: center; padding: 0 5px; }
  .btn { min-width: 86px; height: 50px; border-radius: 25px; font: 600 16px system-ui; cursor: pointer; }
  .btn.use { background: var(--o); }
  .btn:disabled { opacity: .5; }
  .fly { position: fixed; z-index: 30; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.5); pointer-events: none; object-fit: cover; }

  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #000; }
  .start p { max-width: 340px; margin: 0; opacity: .85; }
  .start .go { background: var(--o); color: #fff; border: 0; border-radius: 26px; padding: 14px 28px; font: 700 16px system-ui; cursor: pointer; }
  .brand { font: 800 italic 26px system-ui; letter-spacing: .5px; }
  .brand b { color: var(--o); }

  /* Results sheet: slides up from the bottom; only its inside scrolls. */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 88dvh; z-index: 25; background: #111827; border-radius: 18px 18px 0 0;
           transform: translateY(105%); transition: transform .3s cubic-bezier(.3,0,.2,1); display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.5); }
  .sheet.open { transform: translateY(0); }
  .sheet .head { display: flex; align-items: center; padding: 10px 12px; gap: 8px; border-bottom: 1px solid #1f2937; }
  .sheet .head b { flex: 1; }
  .sheet .head small { color: var(--o); font-weight: 700; }
  .sheet .head button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--o); color: #fff; font-weight: 600; }
  .sheet .body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 12px; }
  .sheet h3 { font-size: 15px; margin: 4px 0 8px; }
  .warn { background: #b91c1c; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
  .note { background: #fef3c7; color: #78350f; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
  .card { border: 1px solid #374151; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; gap: 10px; }
  .card img { width: 90px; height: 120px; object-fit: cover; border-radius: 6px; background: #333; flex: none; }
  .card .t { font-size: 13px; flex: 1; min-width: 0; }
  .card .row { display: flex; gap: 6px; margin-top: 6px; }
  .card .row button, .copy { flex: 1; padding: 8px 4px; border: 0; border-radius: 8px; background: var(--n); color: #fff; font: 600 13px system-ui; cursor: pointer; }
  textarea { width: 100%; height: 200px; font: 12px/1.35 ui-monospace, monospace; border-radius: 8px; padding: 8px; background: #0b1220; color: #e5e7eb; border: 1px solid #374151; }
  .copy { width: 100%; padding: 12px; margin-top: 8px; font-size: 15px; }

  #viewer { position: fixed; inset: 0; background: #000; z-index: 40; display: flex; flex-direction: column; }
  #viewer .bar { display: flex; gap: 8px; padding: 8px; align-items: center; font-size: 13px; }
  #viewer .bar span { flex: 1; }
  #viewer .bar button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--o); color: #fff; font-weight: 600; }
  #viewer .scroll { flex: 1; overflow: auto; }
  #viewer img { display: block; max-width: none; }
</style>
</head>
<body>

<div class="cam" id="cam">
  <video id="video" playsinline muted></video>
  <canvas id="review" hidden></canvas>
  <div id="tap"></div>
  <div class="guide" id="guide"><i></i><i></i><i></i><i></i></div>
  <div class="hint glass" id="hint">Fit the slip inside the corners</div>
  <div id="flash"></div>

  <div class="top" id="liveTop">
    <button class="round sm glass" id="closeBtn" aria-label="Close">✕</button>
    <div class="seg glass"><button id="modeA" class="on">A Still</button><button id="modeB">B Frame</button></div>
    <span class="sp"></span>
    <label class="pill glass">C<input id="nativeInput" type="file" accept="image/*" capture="environment"></label>
    <label class="pill glass">Gallery<input id="galleryInput" type="file" accept="image/*"></label>
  </div>

  <div class="toast glass" id="toast" hidden></div>

  <div class="bottom" id="liveBottom">
    <button class="round glass" id="thumbBtn" aria-label="Results"><svg viewBox="0 0 24 24"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 2v8.6l4.3-4.3 3.2 3.2 2.5-2.5L20 17V7H4z"/></svg><span class="badge" id="badge" hidden>0</span></button>
    <button class="shutter" id="shutter" disabled aria-label="Take photo"></button>
    <button class="round glass" id="torchBtn" disabled aria-label="Torch"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></button>
  </div>

  <div class="bottom" id="reviewBottom" hidden>
    <button class="round glass" id="rotL" aria-label="Rotate left">⟲</button>
    <button class="btn glass" id="retake">Retake</button>
    <button class="btn glass use" id="use">Use</button>
    <button class="round glass" id="rotR" aria-label="Rotate right">⟳</button>
  </div>

  <div class="start" id="startPanel">
    <div class="brand">Trans<b>Log</b></div>
    <p id="startText">TransLog needs your camera to photograph slips, and your location to show where the slip was taken. When Chrome asks, tap <b>Allow</b>.</p>
    <button class="go" id="startBtn">Start camera</button>
    <button class="pill glass" id="startResults">Results and log</button>
    <small style="opacity:.5">Camera test v4 · 27 Nov 2026</small>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="head"><b>Results</b><small>v4</small><button id="sheetClose">Camera</button></div>
  <div class="body">
    <div id="secure"></div>
    <div id="notice"></div>
    <div id="results"></div>
    <h3>Log</h3>
    <textarea id="log" readonly></textarea>
    <button class="copy" id="copyBtn">Copy log</button>
  </div>
</div>

<div id="viewer" hidden>
  <div class="bar"><span id="viewerInfo"></span><button id="viewerClose">Close</button></div>
  <div class="scroll" id="viewerScroll"><img id="viewerImg" alt=""></div>
</div>

<script>
'use strict';
const VERSION = 'v4';
const MAX_EDGE = 1600, QUALITY = 0.8, THUMB_EDGE = 320, REVIEW_EDGE = 1200;
const $ = id => document.getElementById(id);
const video = $('video');
let stream = null, track = null, caps = {}, imageCapture = null, photoCaps = null;
let mode = 'A', torchOn = false, resumeOnShow = false, lastFix = null, count = 0, busy = false, focusLogged = false;
let pending = null; // photo in review: { method, blob, bmp, ms, fix, rot }
const lines = [];

function log(s) { lines.push(s); $('log').value = lines.join('\n'); }
function kb(b) { return b >= 1048576 ? (b / 1048576).toFixed(2) + ' MB' : Math.round(b / 1024) + ' KB'; }
function toBlob(c, type, q) { return new Promise(r => c.toBlob(r, type, q)); }
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
let toastTimer;
function toast(s, ms) {
  clearTimeout(toastTimer);
  if (!s) { $('toast').hidden = true; return; }
  $('toast').textContent = s; $('toast').hidden = false;
  if (ms) toastTimer = setTimeout(() => $('toast').hidden = true, ms);
}

// ---------- Environment ----------
log('TransLog camera test ' + VERSION + ' · ' + new Date().toISOString());
log('Browser: ' + navigator.userAgent);
log('Window ' + innerWidth + 'x' + innerHeight + ' @' + devicePixelRatio + 'x · secure ' + window.isSecureContext + ' · ImageCapture ' + ('ImageCapture' in window));
if (!window.isSecureContext) {
  $('secure').innerHTML = '<div class="warn">Not opened over HTTPS: Chrome blocks the in-page camera and location. Open it from an https:// address.</div>';
  $('startText').innerHTML = 'This page is not opened over <b>https://</b>, so Chrome blocks the camera. Use C or Gallery, or open it from an https address.';
}
try {
  const opened = sessionStorage.getItem('tl-native-open');
  if (opened) {
    const secs = Math.round((Date.now() - Number(opened)) / 1000);
    $('notice').innerHTML = '<div class="note">The page reloaded while the phone camera was open (' + secs + ' s). The photo was lost.</div>';
    log('!! Page reloaded while the phone camera app was open (' + secs + ' s). Photo lost.');
    sessionStorage.removeItem('tl-native-open');
    setTimeout(() => toast('Page reloaded while the phone camera was open – photo lost', 5000), 300);
  }
} catch (e) {}

// ---------- Start at once if the camera is already allowed ----------
(async () => {
  try {
    const p = await navigator.permissions.query({ name: 'camera' });
    log('Camera permission: ' + p.state);
    if (p.state === 'granted') startCamera();
    else if (p.state === 'denied') showDenied();
  } catch (e) { log('Permission check not supported'); }
})();
function showDenied() {
  $('startPanel').hidden = false;
  $('startText').innerHTML = 'The camera is blocked for this site. Tap the icon left of the address, then <b>Permissions › Camera › Allow</b>, and reload.';
}
$('startBtn').onclick = startCamera;
$('startResults').onclick = () => $('sheet').classList.add('open');

// ---------- Location ----------
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    lastFix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, time: p.timestamp };
  }, e => log('Location error ' + e.code + ': ' + e.message),
  { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}
function fixText(f) {
  if (!f) return 'no location';
  return '±' + Math.round(f.acc) + ' m, ' + Math.round((Date.now() - f.time) / 1000) + ' s old (' + f.lat.toFixed(5) + ', ' + f.lng.toFixed(5) + ')';
}

// ---------- Camera ----------
async function startCamera() {
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 4096 }, height: { ideal: 2160 } },
      audio: false
    });
  } catch (e) {
    log('Camera failed: ' + e.name + ' – ' + e.message);
    if (e.name === 'NotAllowedError') showDenied();
    else { $('startPanel').hidden = false; $('startText').textContent = 'The camera could not start (' + e.name + '). Use C or Gallery.'; }
    return;
  }
  $('startPanel').hidden = true;
  track = stream.getVideoTracks()[0];
  video.srcObject = stream;
  await video.play().catch(() => {});
  const s = track.getSettings ? track.getSettings() : {};
  caps = track.getCapabilities ? track.getCapabilities() : {};
  log('Camera: ' + track.label);
  log('  stream ' + s.width + 'x' + s.height + ' @' + Math.round(s.frameRate || 0) + ' fps, focus ' + (s.focusMode || '-') +
      ' | max ' + (caps.width ? caps.width.max + 'x' + caps.height.max : '?') +
      ' | torch ' + !!caps.torch + ' | focus modes ' + ((caps.focusMode || []).join('/') || '-'));
  $('torchBtn').disabled = !caps.torch;
  torchOn = false; $('torchBtn').classList.remove('on');
  imageCapture = null; photoCaps = null;
  if ('ImageCapture' in window) {
    imageCapture = new ImageCapture(track);
    try {
      photoCaps = await imageCapture.getPhotoCapabilities();
      log('  full still max ' + photoCaps.imageWidth.max + 'x' + photoCaps.imageHeight.max);
    } catch (e) { log('  getPhotoCapabilities failed: ' + e.message); }
  }
  $('shutter').disabled = false;
}
function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null; imageCapture = null;
  video.srcObject = null;
  $('shutter').disabled = true; $('torchBtn').disabled = true;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (stream) { resumeOnShow = true; stopCamera(); log('Page hidden: camera off'); }
  } else if (resumeOnShow) {
    resumeOnShow = false; log('Page visible: camera on'); startCamera();
  }
});

// In the real app ✕ goes back to the Driver home; here it switches the camera off.
$('closeBtn').onclick = () => {
  stopCamera();
  $('startPanel').hidden = false;
  $('startText').textContent = 'Camera off. In TransLog this button goes back to the Driver home.';
};

$('modeA').onclick = () => { mode = 'A'; $('modeA').classList.add('on'); $('modeB').classList.remove('on'); };
$('modeB').onclick = () => { mode = 'B'; $('modeB').classList.add('on'); $('modeA').classList.remove('on'); };
$('torchBtn').onclick = async () => {
  if (!track) return;
  try {
    await track.applyConstraints({ advanced: [{ torch: !torchOn }] });
    torchOn = !torchOn; $('torchBtn').classList.toggle('on', torchOn);
  } catch (e) { log('Torch failed: ' + e.message); }
};

// ---------- Tap to focus: a CSS ring, and focus sent to that spot if the phone allows it ----------
$('tap').addEventListener('click', async e => {
  if (!track || pending) return;
  const ring = document.createElement('div');
  ring.className = 'ring'; ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
  $('cam').appendChild(ring);
  setTimeout(() => ring.remove(), 1400);

  const vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(innerWidth / vw, innerHeight / vh);
  const ox = (innerWidth - vw * sc) / 2, oy = (innerHeight - vh * sc) / 2;
  const pt = { x: Math.min(1, Math.max(0, (e.clientX - ox) / sc / vw)), y: Math.min(1, Math.max(0, (e.clientY - oy) / sc / vh)) };
  const modes = caps.focusMode || [], c = { pointsOfInterest: [pt] };
  if (modes.includes('single-shot')) c.focusMode = 'single-shot';
  else if (modes.includes('continuous')) c.focusMode = 'continuous';
  try {
    await track.applyConstraints({ advanced: [c] });
    if (!focusLogged) { focusLogged = true; log('Tap to focus: sent (' + (c.focusMode || 'no focus mode') + ')'); }
    if (c.focusMode === 'single-shot' && modes.includes('continuous')) {
      setTimeout(() => track && track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}), 4000);
    }
  } catch (err) {
    if (!focusLogged) { focusLogged = true; log('Tap to focus not supported: ' + err.name); }
  }
});

// ---------- Shutter ----------
$('shutter').onclick = async () => {
  if (!track || busy) return;
  busy = true; $('shutter').disabled = true;
  const fix = lastFix, t0 = performance.now();
  buzz(30);
  $('flash').animate([{ opacity: 0.9 }, { opacity: 0 }], { duration: 280, easing: 'ease-out' });
  try {
    let blob, method;
    if (mode === 'A' && imageCapture) {
      const s = {};
      if (photoCaps && photoCaps.imageWidth) { s.imageWidth = photoCaps.imageWidth.max; s.imageHeight = photoCaps.imageHeight.max; }
      blob = await imageCapture.takePhoto(s); method = 'A. Full still';
    } else {
      const c = document.createElement('canvas');
      c.width = video.videoWidth; c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0);
      blob = await toBlob(c, 'image/jpeg', 0.95); method = 'B. Video frame';
    }
    await review(method, blob, performance.now() - t0, fix);
  } catch (e) {
    toast('Photo failed: ' + e.name, 4000);
    log('Shutter (' + mode + ') failed: ' + e.name + ' – ' + e.message);
  }
  if (track && track.readyState !== 'live') { log('Stream stopped after the photo; restarting'); startCamera(); }
  busy = false; if (track) $('shutter').disabled = false;
};

// ---------- Phone camera and gallery go to the same review screen ----------
function fileInput(input, method, markOpen) {
  input.addEventListener('click', () => { if (markOpen) try { sessionStorage.setItem('tl-native-open', String(Date.now())); } catch (e) {} });
  input.addEventListener('cancel', () => { try { sessionStorage.removeItem('tl-native-open'); } catch (e) {} });
  input.addEventListener('change', async () => {
    try { sessionStorage.removeItem('tl-native-open'); } catch (e) {}
    const f = input.files && input.files[0];
    input.value = '';
    if (f) await review(method, f, null, lastFix);
  });
}
fileInput($('nativeInput'), 'C. Phone camera', true);
fileInput($('galleryInput'), 'D. Gallery', false);

// ---------- Review: rotate, retake, use ----------
async function review(method, blob, ms, fix) {
  let bmp;
  try { bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' }); }
  catch (e) { toast('Could not read the photo', 4000); log(method + ': could not decode (' + (blob.type || '?') + ') ' + e.message); return; }
  pending = { method, blob, bmp, ms, fix, rot: 0 };
  drawReview();
  $('startPanel').hidden = true;
  $('review').hidden = false; video.hidden = true;
  $('guide').hidden = true; $('hint').hidden = true;
  $('liveTop').hidden = true; $('liveBottom').hidden = true; $('reviewBottom').hidden = false;
}
function drawReview() {
  const c = drawScaled(pending.bmp, REVIEW_EDGE, pending.rot), rc = $('review');
  rc.width = c.width; rc.height = c.height;
  rc.getContext('2d').drawImage(c, 0, 0);
}
function backToCamera() {
  if (pending && pending.bmp.close) pending.bmp.close();
  pending = null;
  $('review').hidden = true; video.hidden = false;
  $('guide').hidden = false; $('hint').hidden = false;
  $('liveTop').hidden = false; $('liveBottom').hidden = false; $('reviewBottom').hidden = true;
  if (!track) $('startPanel').hidden = false;
}
$('rotL').onclick = () => { if (pending) { pending.rot = (pending.rot + 270) % 360; drawReview(); } };
$('rotR').onclick = () => { if (pending) { pending.rot = (pending.rot + 90) % 360; drawReview(); } };
$('retake').onclick = () => { if (pending) log('Retake (' + pending.method + ')'); backToCamera(); };
$('use').onclick = async () => {
  if (!pending) return;
  $('use').disabled = true;
  const thumbUrl = await keep(pending);
  $('use').disabled = false;
  const from = $('review').getBoundingClientRect();
  backToCamera();
  flyToThumb(thumbUrl, from);
};

// The kept photo shrinks into the thumbnail button bottom-left.
function flyToThumb(url, from) {
  const to = $('thumbBtn').getBoundingClientRect();
  const img = document.createElement('img');
  img.src = url; img.className = 'fly';
  const w = Math.min(from.width * 0.7, 360), h = w * 4 / 3;
  Object.assign(img.style, { left: (innerWidth - w) / 2 + 'px', top: (innerHeight - h) / 2 + 'px', width: w + 'px', height: h + 'px' });
  document.body.appendChild(img);
  const dx = to.left + to.width / 2 - innerWidth / 2, dy = to.top + to.height / 2 - innerHeight / 2, s = to.width / w;
  img.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1, borderRadius: '10px' },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')', opacity: 0.9, borderRadius: '50%' }
  ], { duration: 450, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = () => {
    img.remove();
    const tb = $('thumbBtn');
    tb.style.backgroundImage = 'url(' + url + ')';
    tb.querySelector('svg').style.display = 'none';
    $('badge').hidden = false; $('badge').textContent = count;
    tb.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 250 });
    buzz(15);
  };
}

// ---------- Results sheet ----------
$('thumbBtn').onclick = () => $('sheet').classList.add('open');
$('sheetClose').onclick = () => $('sheet').classList.remove('open');

// ---------- Compress, measure, list ----------
async function keep(p) {
  const { method, blob, bmp, ms, fix, rot } = p;
  const W = bmp.width, H = bmp.height, t1 = performance.now();
  const main = drawScaled(bmp, MAX_EDGE, rot);
  let sent = await toBlob(main, 'image/jpeg', QUALITY), kept = false, sentW = main.width, sentH = main.height;
  // The original is kept only when it is a JPEG, not rotated, not huge, and smaller than the compressed copy.
  if (rot === 0 && blob.type === 'image/jpeg' && blob.size <= sent.size && Math.max(W, H) <= MAX_EDGE * 1.5) {
    sent = blob; kept = true; sentW = W; sentH = H;
  }
  const thumb = await toBlob(drawScaled(bmp, THUMB_EDGE, rot), 'image/jpeg', 0.7);
  const compressMs = performance.now() - t1, sharp = sharpness(main), n = ++count;
  log('#' + n + ' ' + method +
    ' | source ' + W + 'x' + H + ' ' + kb(blob.size) + ' ' + (blob.type || '?') + (ms != null ? ', took ' + Math.round(ms) + ' ms' : '') +
    ' | rotated ' + rot + '° | sent ' + sentW + 'x' + sentH + ' ' + kb(sent.size) + (kept ? ' (original kept)' : ' (compressed ' + Math.round(compressMs) + ' ms)') +
    ' | thumb ' + kb(thumb.size) + ' | sharp ' + sharp + ' | ' + fixText(fix));

  const sentUrl = URL.createObjectURL(sent), srcUrl = URL.createObjectURL(blob), thumbUrl = URL.createObjectURL(thumb);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<img alt=""><div class="t"><b>#' + n + ' ' + method + '</b><br>' +
    'Source: ' + W + '×' + H + ', ' + kb(blob.size) + (ms != null ? ', ' + Math.round(ms) + ' ms' : '') + '<br>' +
    'Sent: ' + sentW + '×' + sentH + ', ' + kb(sent.size) + (kept ? ' (original kept)' : '') + (rot ? ', rotated ' + rot + '°' : '') + '<br>' +
    'Thumb: ' + kb(thumb.size) + ' · Sharp: <b>' + sharp + '</b><br>Location: ' + fixText(fix) +
    '<div class="row"><button data-v="sent">View 1600</button><button data-v="src">View source</button></div></div>';
  card.querySelector('img').src = thumbUrl;
  card.querySelector('[data-v=sent]').onclick = () => view(sentUrl, '#' + n + ' ' + method + ' · sent ' + sentW + '×' + sentH);
  card.querySelector('[data-v=src]').onclick = () => view(srcUrl, '#' + n + ' ' + method + ' · source (not rotated) ' + W + '×' + H);
  $('results').prepend(card);
  return thumbUrl;
}

// Scales so the longest side is at most `edge`, turned clockwise by `rot` degrees.
function drawScaled(bmp, edge, rot) {
  const scale = Math.min(1, edge / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale), turned = rot === 90 || rot === 270;
  const c = document.createElement('canvas');
  c.width = turned ? h : w; c.height = turned ? w : h;
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.translate(c.width / 2, c.height / 2);
  g.rotate(rot * Math.PI / 180);
  g.drawImage(bmp, -w / 2, -h / 2, w, h);
  return c;
}

// Variance of the Laplacian on the centre 400×400 of the 1600 image (only after Use, never live).
function sharpness(canvas) {
  const s = Math.min(400, canvas.width, canvas.height);
  const x0 = Math.floor((canvas.width - s) / 2), y0 = Math.floor((canvas.height - s) / 2);
  const d = canvas.getContext('2d').getImageData(x0, y0, s, s).data, g = new Float32Array(s * s);
  for (let i = 0; i < s * s; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  let sum = 0, sum2 = 0, n = 0;
  for (let y = 1; y < s - 1; y++) for (let x = 1; x < s - 1; x++) {
    const i = y * s + x, l = g[i - s] + g[i + s] + g[i - 1] + g[i + 1] - 4 * g[i];
    sum += l; sum2 += l * l; n++;
  }
  const mean = sum / n;
  return Math.round(sum2 / n - mean * mean);
}

// ---------- Full-size viewer ----------
function view(url, info) {
  const img = $('viewerImg'), sc = $('viewerScroll');
  $('viewerInfo').textContent = info + ' · 100%';
  $('viewer').hidden = false;
  img.onload = () => { sc.scrollLeft = (img.naturalWidth - sc.clientWidth) / 2; sc.scrollTop = (img.naturalHeight - sc.clientHeight) / 2; };
  img.src = url;
}
$('viewerClose').onclick = () => { $('viewer').hidden = true; $('viewerImg').removeAttribute('src'); };

$('copyBtn').onclick = async () => {
  const t = $('log');
  try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand('copy'); }
  $('copyBtn').textContent = 'Copied';
  setTimeout(() => $('copyBtn').textContent = 'Copy log', 1500);
};
